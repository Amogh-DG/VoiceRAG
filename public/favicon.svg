<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mic-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Outer Sound Waves -->
  <g stroke="url(#wave-grad)" stroke-linecap="round" stroke-width="3" filter="url(#glow)">
    <!-- Left bar 1 -->
    <line x1="14" y1="28" x2="14" y2="36" opacity="0.6" />
    <!-- Left bar 2 -->
    <line x1="20" y1="22" x2="20" y2="42" opacity="0.85" />
    <!-- Center Left -->
    <line x1="26" y1="16" x2="26" y2="48" />
    <!-- Center Right -->
    <line x1="38" y1="16" x2="38" y2="48" />
    <!-- Right bar 2 -->
    <line x1="44" y1="22" x2="44" y2="42" opacity="0.85" />
    <!-- Right bar 1 -->
    <line x1="50" y1="28" x2="50" y2="36" opacity="0.6" />
  </g>

  <!-- Central Voice AI Mic Capsule -->
  <rect x="29" y="20" width="6" height="16" rx="3" fill="url(#mic-grad)" filter="url(#glow)" />
  <path d="M26 31C26 34.3137 28.6863 37 32 37C35.3137 37 38 34.3137 38 31" stroke="url(#wave-grad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="37" x2="32" y2="42" stroke="url(#wave-grad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- AI Sparkle Icon top-right -->
  <path d="M48 12L49.2 14.8L52 16L49.2 17.2L48 20L46.8 17.2L44 16L46.8 14.8L48 12Z" fill="#38bdf8" />
</svg>